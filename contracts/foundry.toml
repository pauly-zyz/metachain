[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1000
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "account-abstraction/=lib/account-abstraction/contracts/",
  "@uniswap/v3-core/=lib/v3-core/",
  "@uniswap/v3-periphery/=lib/v3-periphery/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 1000

[profile.ci.fuzz]
runs = 5000

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"

[etherscan]
# Blockscout verifier (Etherscan-compatible API). No key needed for Blockscout.
robinhood_testnet = { key = "${BLOCKSCOUT_API_KEY:-blockscout}", chain = 46630, url = "https://explorer.testnet.chain.robinhood.com/api/" }
robinhood = { key = "${BLOCKSCOUT_API_KEY:-blockscout}", chain = 4663, url = "https://robinhoodchain.blockscout.com/api/" }

[lint]
lint_on_build = false
